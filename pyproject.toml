[project]
name = "campus-unr-mcp"
version = "0.1.0"
description = "MCP server + CLI for Campus Virtual FCEIA UNR (Moodle)"
authors = [{name = "Juan Pablo Manson"}]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.scripts]
campus = "campus_unr_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/campus_unr_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
